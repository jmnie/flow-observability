[package]
name = "flow-observability-spike"
version = "0.0.0"
edition = "2024"
publish = false

[features]
default = []
live-capture = ["dep:pcap"]

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["http1", "json", "tokio"] }
blake3 = "1.8"
clap = { version = "4.5", features = ["derive"] }
pcap = { version = "2.3", optional = true }
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.48", features = ["net", "rt", "signal"] }
ureq = { version = "2.12", features = ["json"] }

[dev-dependencies]
tempfile = "3.23"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
